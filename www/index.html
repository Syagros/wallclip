<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wallclip</title>

<link rel="stylesheet" href="/style.css">

<!--# set var="wc_t" value="" --><!--# set var="wc_def" value="1" -->

<!--# if expr="$cookie_wc_theme = default-light" --><!--# set var="wc_t" value="default-light" --><!--# set var="wc_def" value="" --><!--# endif -->
<!--# if expr="$cookie_wc_theme = gruvbox" --><!--# set var="wc_t" value="gruvbox" --><!--# set var="wc_def" value="" --><!--# endif -->
<!--# if expr="$cookie_wc_theme = gruvbox-light" --><!--# set var="wc_t" value="gruvbox-light" --><!--# set var="wc_def" value="" --><!--# endif -->
<!--# if expr="$cookie_wc_theme = catppuccin" --><!--# set var="wc_t" value="catppuccin" --><!--# set var="wc_def" value="" --><!--# endif -->
<!--# if expr="$cookie_wc_theme = tokyonight" --><!--# set var="wc_t" value="tokyonight" --><!--# set var="wc_def" value="" --><!--# endif -->
<!--# if expr="$args = theme=" --><!--# set var="wc_t" value="" --><!--# set var="wc_def" value="1" --><!--# endif -->
<!--# if expr="$arg_theme = default-light" --><!--# set var="wc_t" value="default-light" --><!--# set var="wc_def" value="" --><!--# endif -->
<!--# if expr="$arg_theme = gruvbox" --><!--# set var="wc_t" value="gruvbox" --><!--# set var="wc_def" value="" --><!--# endif -->
<!--# if expr="$arg_theme = gruvbox-light" --><!--# set var="wc_t" value="gruvbox-light" --><!--# set var="wc_def" value="" --><!--# endif -->
<!--# if expr="$arg_theme = catppuccin" --><!--# set var="wc_t" value="catppuccin" --><!--# set var="wc_def" value="" --><!--# endif -->
<!--# if expr="$arg_theme = tokyonight" --><!--# set var="wc_t" value="tokyonight" --><!--# set var="wc_def" value="" --><!--# endif -->
<body class="home"<!--# if expr="$wc_t" --> data-theme="<!--# echo var="wc_t" -->"<!--# endif -->>
<header>
  <a class="brand" href="/">wall<b>clip</b></a>
  <form action="/search" method="get">
    <div class="searchbar">
      <input type="search" name="q" placeholder="Search images…" aria-label="Search">
      <button type="submit">Search</button>
    </div>
  </form>
  <div class="spacer"></div>
  <details class="theme">
    <summary title="Colour theme" aria-label="Colour theme">Theme</summary>
    <form class="theme-list" method="get" action="/">
      <button type="submit" name="theme" value=""<!--# if expr="$wc_def" --> aria-current="true"<!--# endif -->>Default</button>
      <button type="submit" name="theme" value="default-light"<!--# if expr="$wc_t = default-light" --> aria-current="true"<!--# endif -->>Default Light</button>
      <button type="submit" name="theme" value="gruvbox"<!--# if expr="$wc_t = gruvbox" --> aria-current="true"<!--# endif -->>Gruvbox</button>
      <button type="submit" name="theme" value="gruvbox-light"<!--# if expr="$wc_t = gruvbox-light" --> aria-current="true"<!--# endif -->>Gruvbox Light</button>
      <button type="submit" name="theme" value="catppuccin"<!--# if expr="$wc_t = catppuccin" --> aria-current="true"<!--# endif -->>Catppuccin</button>
      <button type="submit" name="theme" value="tokyonight"<!--# if expr="$wc_t = tokyonight" --> aria-current="true"<!--# endif -->>Tokyo Night</button>
    </form>
  </details>
</header>

<main class="grid">
  <!--# include virtual="/_home/" -->
</main>
</body>
</html>
