<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wallclip</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/themes.css">
</head>
<!--# set var="wc_t" value="" --><!--# set var="wc_def" value="1" -->
<!-- cookie first, then ?theme= wins (SSI has no else/nested if) -->
<!--# if expr="$cookie_wc_theme = gruvbox" --><!--# set var="wc_t" value="gruvbox" --><!--# set var="wc_def" value="" --><!--# endif -->
<!--# if expr="$cookie_wc_theme = catppuccin" --><!--# set var="wc_t" value="catppuccin" --><!--# set var="wc_def" value="" --><!--# endif -->
<!--# if expr="$cookie_wc_theme = tokyonight" --><!--# set var="wc_t" value="tokyonight" --><!--# set var="wc_def" value="" --><!--# endif -->
<!--# if expr="$cookie_wc_theme = dracula" --><!--# set var="wc_t" value="dracula" --><!--# set var="wc_def" value="" --><!--# endif -->
<!--# if expr="$cookie_wc_theme = nord" --><!--# set var="wc_t" value="nord" --><!--# set var="wc_def" value="" --><!--# endif -->
<!--# if expr="$args = theme=" --><!--# set var="wc_t" value="" --><!--# set var="wc_def" value="1" --><!--# endif --><!-- cookie arg overrides cookie only when it names a theme -->
<!--# if expr="$arg_theme = gruvbox" --><!--# set var="wc_t" value="gruvbox" --><!--# set var="wc_def" value="" --><!--# endif -->
<!--# if expr="$arg_theme = catppuccin" --><!--# set var="wc_t" value="catppuccin" --><!--# set var="wc_def" value="" --><!--# endif -->
<!--# if expr="$arg_theme = tokyonight" --><!--# set var="wc_t" value="tokyonight" --><!--# set var="wc_def" value="" --><!--# endif -->
<!--# if expr="$arg_theme = dracula" --><!--# set var="wc_t" value="dracula" --><!--# set var="wc_def" value="" --><!--# endif -->
<!--# if expr="$arg_theme = nord" --><!--# set var="wc_t" value="nord" --><!--# set var="wc_def" value="" --><!--# endif -->
<body class="search"<!--# if expr="$wc_t" --> data-theme="<!--# echo var="wc_t" -->"<!--# endif -->>
<input type="checkbox" id="theme" hidden>
<header>
  <a class="brand" href="/">wall<b>clip</b></a>
  <form action="/search" method="get">
    <div class="searchbar">
      <input type="search" name="q" placeholder="Search images…" aria-label="Search">
      <button type="submit">Search</button>
    </div>
  </form>
  <div class="spacer"></div>
  <label for="theme" title="Toggle light/dark"></label>
  <details class="theme">
    <summary title="Colour theme" aria-label="Colour theme">Theme</summary>
    <form class="theme-list" method="get" action="/search">
      <button type="submit" name="theme" value=""<!--# if expr="$wc_def" --> aria-current="true"<!--# endif -->>Default</button>
      <button type="submit" name="theme" value="gruvbox"<!--# if expr="$wc_t = gruvbox" --> aria-current="true"<!--# endif -->>Gruvbox</button>
      <button type="submit" name="theme" value="catppuccin"<!--# if expr="$wc_t = catppuccin" --> aria-current="true"<!--# endif -->>Catppuccin</button>
      <button type="submit" name="theme" value="tokyonight"<!--# if expr="$wc_t = tokyonight" --> aria-current="true"<!--# endif -->>Tokyo Night</button>
      <button type="submit" name="theme" value="dracula"<!--# if expr="$wc_t = dracula" --> aria-current="true"<!--# endif -->>Dracula</button>
      <button type="submit" name="theme" value="nord"<!--# if expr="$wc_t = nord" --> aria-current="true"<!--# endif -->>Nord</button>
    </form>
  </details>
</header>

<main class="grid">
<!--# if expr="$arg_q" --><img loading="lazy" src="<!--# include virtual="/_q/$arg_q" -->"><!--# endif -->
<div class="empty"<!--# if expr="$arg_q" --> hidden<!--# endif -->>Type something to search</div>
</main>
</body>
</html>
